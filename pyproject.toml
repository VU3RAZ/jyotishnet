[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jyotishnet"
version = "0.1.0"
description = "JyotishNet: calculation core and API for a Vedic astrology workbench"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Rahul Sathe" }]
requires-python = ">=3.11"
dependencies = [
    "pyswisseph>=2.10",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "tzdata",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jyotishnet_engine = ["rules/*.yaml", "rules/yogas/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
