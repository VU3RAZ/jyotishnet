# Pancha Mahapurusha yogas. A planet in its own sign (incl. moolatrikona) or
# exaltation, placed in a kendra from the Lagna.
- id: ruchaka
  name: Ruchaka
  group: Pancha Mahapurusha
  summary: Mars in own sign or exaltation in a kendra from the Lagna.
  source: {text: Brihat Parashara Hora Shastra, section: Pancha Mahapurusha Yogas}
  notes: Some authors also count kendras from the Moon.
  when:
    all:
      - dignity: {planet: Ma, in: [own, moolatrikona, exalted]}
      - in_house: {planet: Ma, houses: [1, 4, 7, 10]}
