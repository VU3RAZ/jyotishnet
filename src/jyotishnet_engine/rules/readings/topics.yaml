# Topics for rule-based readings (M3.4; design doc, Layer 4 #4 and #5, without the
# network). For each topic: the houses to judge (from the Lagna, whole sign), the
# natural karaka, the governing varga (null: D1 only; the Hora has two signs and no
# houses), and yogas that classical texts tie to the topic, with their direction.
# Judging a house from its lord, occupants, aspects and karaka follows Phaladeepika,
# "Bhava Chinta", and BPHS, "Effects of the lords of the houses". All drafts until
# the user's Jyotish reviewer signs them off.
#
# theme: how sentences name the topic (default: the name in lower case).
# technical_only: factors are computed and listed for the astrologer, but no draft
# text is written (design doc, Safety filter). disclaimer: medical, legal or financial.
