- id: health
  name: Health indicators (technical)
  theme: health indicators
  group: Health
  houses: [1, 6, 8]
  karaka: Su
  varga: 30
  technical_only: true
  disclaimer: medical
  # The 6th and 8th lords in a dusthana form Harsha and Sarala yogas (Phaladeepika 6.57),
  # read as good health and strength (6.63, 6.65), not as the general rule's obstruction.
  house_rules:
    6:
      lord:
        dusthana: {reads: supports, cite: "Phaladeepika 6.57, 6.63: Harsha yoga, strong constitution"}
    8:
      lord:
        dusthana: {reads: supports, cite: "Phaladeepika 6.57, 6.65: Sarala yoga"}
  yogas: {supports: [], obstructs: []}
  source: {text: Brihat Parashara Hora Shastra, section: "Effects of the 1st, 6th and 8th houses; Trimsamsa"}
  status: draft
